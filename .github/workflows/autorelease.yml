name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.12.7"

      - name: Verify release metadata
        run: |
          test "v$(uv version --short)" = "$GITHUB_REF_NAME"
          uv lock --check

      - name: Install release tools
        run: uv sync --frozen --only-group release

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uv run --frozen --only-group release twine check dist/*

      - id: install-secret-key
        name: Import GPG signing key
        env:
          SLIVERPY_GPG: "${{ secrets.SLIVERPY_GPG }}"
        run: |
          printf '%s' "$SLIVERPY_GPG" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Create GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

      - name: Upload to PyPI
        env:
          TWINE_NON_INTERACTIVE: 1
          TWINE_PASSWORD: "${{ secrets.TWINE_PASSWORD }}"
          TWINE_USERNAME: __token__
        run: >-
          uv run --frozen --only-group release twine upload
          --sign --identity 9F68D30C --repository pypi dist/*
