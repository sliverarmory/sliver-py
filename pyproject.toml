[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "sliver-py"
version = "0.1.0"
description = "Async Python client library for the Sliver gRPC API."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "moloch", email = "875022+moloch--@users.noreply.github.com" },
    { name = "daddycocoaman", email = "daddycocoaman@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "grpcio>=1.81.1,<2",
    "protobuf>=6.33.5,<7",
    "pydantic>=2.10,<3",
]

[project.urls]
Documentation = "https://sliverpy.readthedocs.io/"
Homepage = "https://github.com/moloch--/sliver-py"
Issues = "https://github.com/moloch--/sliver-py/issues"
Repository = "https://github.com/moloch--/sliver-py.git"

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "protobuf" },
    { include-group = "test" },
]
docs = [
    "sphinx>=8,<9",
    "sphinx-autodoc-typehints>=2.5,<4",
    "sphinx-rtd-theme>=3.0,<4",
]
lint = [
    "ruff>=0.12,<1",
]
protobuf = [
    "grpcio-tools>=1.81.1,<2",
    "mypy-protobuf>=3.6,<4",
]
release = [
    "twine>=6.2,<7",
]
test = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "client: tests that exercise the top-level Sliver client API",
    "e2e: tests that build or execute Sliver components on an isolated runner",
    "e2e_basic: end-to-end tests for server and top-level client interactions",
    "e2e_beacon: end-to-end tests that generate and interact with a native beacon",
    "e2e_session: end-to-end tests that generate and interact with a native session",
    "interactive: tests that exercise an interactive Sliver session",
    "integration: tests that require a running Sliver server",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["src/sliver/_pb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.uv.build-backend]
module-name = "sliver"
